<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>톤챗 디자인 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
/* 색은 모두 apps/mobile/lib/tokens.json과 같은 값. 파생 색은 --scrim 하나뿐. */
:root {
  color-scheme: light;
  --primary: #0F766E; --on-primary: #FFFFFF;
  --bubble-other: #F1F5F4; --on-bubble-other: #0F172A;
  --background: #FFFFFF; --surface: #F7FAF9;
  --text: #0F172A; --text-muted: #5B6B68; --border: #E2E8E6;
  --hint-bg: #FFF7ED; --hint-text: #9A3412;
  --mirror: #7C3AED; --on-mirror: #FFFFFF; --danger: #DC2626;
  --scrim: color-mix(in srgb, var(--text) 32%, transparent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --primary: #2DD4BF; --on-primary: #042F2E;
    --bubble-other: #1E2B2A; --on-bubble-other: #E6EEEC;
    --background: #0B1211; --surface: #121A19;
    --text: #E6EEEC; --text-muted: #94A3A0; --border: #26332F;
    --hint-bg: #2A1E12; --hint-text: #FEE7CF;
    --mirror: #A78BFA; --on-mirror: #1E1B2E; --danger: #F87171;
    --scrim: color-mix(in srgb, var(--background) 72%, transparent);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --primary: #2DD4BF; --on-primary: #042F2E;
  --bubble-other: #1E2B2A; --on-bubble-other: #E6EEEC;
  --background: #0B1211; --surface: #121A19;
  --text: #E6EEEC; --text-muted: #94A3A0; --border: #26332F;
  --hint-bg: #2A1E12; --hint-text: #FEE7CF;
  --mirror: #A78BFA; --on-mirror: #1E1B2E; --danger: #F87171;
  --scrim: color-mix(in srgb, var(--background) 72%, transparent);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--surface); color: var(--text);
  font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  font-size: 16px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
button, textarea { font: inherit; color: inherit; background: none; border: 0; }
button { cursor: pointer; transition: background-color 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.i-sm { width: 18px; height: 18px; }
/* 작은 컨트롤의 터치 영역을 44px로 넓힌다 */
.hit { position: relative; }
.hit::after { content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: max(100%, 44px); transform: translate(-50%, -50%); }

/* 페이지 */
.page-head { max-width: 1280px; margin: 0 auto; padding: 24px 16px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.page-head h1 { font-size: 20px; font-weight: 600; }
.page-head p { font-size: 13px; color: var(--text-muted); }
.page-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; }
.btn-secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
.page-actions .btn-secondary { background: var(--background); }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-mirror { background: var(--mirror); color: var(--on-mirror); }
.btn-block { width: 100%; min-height: 48px; }

.frames { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; display: grid; gap: 40px 32px; justify-content: center;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 390px), 390px)); }
.frames figure { min-width: 0; }
.frames figcaption { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
.frames figcaption b { color: var(--text); font-weight: 600; }

/* 폰 프레임 390×844 */
.phone { position: relative; width: 100%; max-width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column;
  background: var(--background); border: 1px solid var(--border); border-radius: 44px; }
.status { height: 44px; flex: none; padding: 14px 32px 0; font-size: 13px; font-weight: 600; }
.appbar { height: 56px; flex: none; padding: 0 8px 0 16px; display: flex; align-items: center; gap: 4px; }
.appbar h2 { font-size: 20px; font-weight: 600; flex: 1; }
.appbar.room { padding: 0 8px 0 4px; border-bottom: 1px solid var(--border); }
.appbar.room h2 { font-size: 16px; }
.appbar.room h2 small { font-size: 13px; font-weight: 400; color: var(--text-muted); margin-left: 4px; }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 999px; display: inline-grid; place-items: center; color: var(--text); }
.icon-btn:hover { background: var(--surface); }
.content { flex: 1; min-height: 0; overflow: hidden; }

.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 4px 8px 24px; border-top: 1px solid var(--border); background: var(--background); }
.tab { min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; color: var(--text-muted); }
.tab[aria-current="page"] { color: var(--primary); font-weight: 600; }

/* ① 대화 목록 */
.rooms { list-style: none; }
.rooms a { display: flex; gap: 12px; align-items: center; padding: 10px 16px; min-height: 72px; color: inherit; text-decoration: none; }
.rooms a:hover { background: var(--surface); }
.avatar { width: 48px; height: 48px; flex: none; border-radius: 999px; display: grid; place-items: center; background: var(--bubble-other); color: var(--on-bubble-other); font-weight: 600; }
.avatar.sm { width: 36px; height: 36px; font-size: 13px; }
.room-main { flex: 1; min-width: 0; }
.room-top, .room-bottom { display: flex; align-items: center; gap: 8px; }
.room-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-count { font-size: 13px; color: var(--text-muted); }
.room-top time { margin-left: auto; font-size: 13px; color: var(--text-muted); white-space: nowrap; }
.room-preview { flex: 1; min-width: 0; font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; display: inline-grid; place-items: center; font-size: 13px; font-weight: 600; line-height: 1; background: var(--primary); color: var(--on-primary); }
.badge.muted { background: var(--bubble-other); color: var(--text-muted); }
.room-bottom .i { color: var(--text-muted); }

/* ② 대화방 */
.msgs { flex: 1; min-height: 0; overflow: hidden; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
.day { align-self: center; font-size: 13px; color: var(--text-muted); margin: 4px 0 8px; }
.row { display: flex; align-items: flex-end; gap: 8px; }
.row + .row.switch { margin-top: 8px; }
.row.me { justify-content: flex-end; }
.row .avatar.sm { align-self: flex-start; }
.row .spacer { width: 36px; flex: none; }
.stack { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; max-width: 75%; }
.row.me .stack { align-items: flex-end; }
.sender { font-size: 13px; color: var(--text-muted); }
.line { display: flex; align-items: flex-end; gap: 6px; max-width: 100%; }
.row.me .line { flex-direction: row-reverse; }
.bubble { padding: 8px 14px; border-radius: 18px; min-width: 0; } /* 꼬리 없음 */
.row.me .bubble { background: var(--primary); color: var(--on-primary); }
.row.other .bubble { background: var(--bubble-other); color: var(--on-bubble-other); }
.meta { flex: none; display: flex; flex-direction: column; font-size: 13px; line-height: 1.3; color: var(--text-muted); white-space: nowrap; }
.row.me .meta { align-items: flex-end; }
.unread { color: var(--primary); font-weight: 600; }
.quote { display: block; margin: 2px 0 6px; padding-left: 8px; border-left: 2px solid var(--text-muted); font-size: 13px; color: var(--text-muted); }
.quote b { display: block; font-weight: 600; color: var(--on-bubble-other); }
.reactions { display: flex; gap: 4px; }
.reaction { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--background); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.reaction[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); font-weight: 600; }
.typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
.typing span { width: 6px; height: 6px; border-radius: 999px; background: var(--text-muted); animation: blink 1.2s ease-in-out infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .35; } 30% { opacity: 1; } }
.more { width: 32px; height: 32px; flex: none; border-radius: 999px; display: grid; place-items: center; color: var(--text-muted); }

/* 힌트: 입력창 바로 위 한 줄. 전송 버튼은 그대로 */
.hint { flex: none; margin: 0 12px 8px; padding-left: 14px; min-height: 44px; border-radius: 999px; display: flex; align-items: center; gap: 8px;
  background: var(--hint-bg); color: var(--hint-text); font-size: 13px; animation: hint-in 200ms ease-out both; }
.hint[hidden] { display: none; }
.hint-dot { width: 8px; height: 8px; flex: none; border-radius: 999px; background: var(--hint-text); }
.hint-title { min-width: 0; }
#hint-close { margin-left: auto; }
.hint-open { font-weight: 600; white-space: nowrap; min-height: 44px; padding: 0 4px; color: var(--hint-text); }
.hint .icon-btn { color: var(--hint-text); }
.hint .icon-btn:hover { background: transparent; }
@keyframes hint-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.composer { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 0 12px 28px; }
.composer .icon-btn { color: var(--text-muted); }
.field { flex: 1; min-width: 0; min-height: 44px; padding: 9px 16px; border-radius: 22px; border: 1px solid var(--border); background: var(--surface); resize: none; line-height: 1.5; }
.send { width: 44px; height: 44px; flex: none; border-radius: 999px; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); }

/* 시트 */
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - 64px); display: flex; flex-direction: column;
  background: var(--background); border-top: 1px solid var(--border); border-radius: 20px 20px 0 0; }
.handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border); margin: 8px auto 4px; flex: none; }
.sheet-head { display: flex; align-items: center; padding: 0 8px 0 20px; flex: none; }
.sheet-head h3 { font-size: 20px; font-weight: 600; flex: 1; }
.sheet-body { flex: 1; min-height: 0; overflow: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 16px; }
.sheet-actions { flex: none; display: flex; gap: 8px; padding: 12px 20px 28px; border-top: 1px solid var(--border); }
.sheet-actions .btn { flex: 1; min-height: 48px; }
.label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
.label span { font-weight: 400; }
.boxed { padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--background); }
.chip[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; }

.readings { list-style: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.readings li { padding: 8px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; }
.readings .level { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 8px; height: 8px; border-radius: 999px; background: var(--border); }
.pips i.on { background: var(--text-muted); }

.why { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.why li { padding-left: 14px; position: relative; }
.why li::before { content: ""; position: absolute; left: 2px; top: .7em; width: 4px; height: 4px; border-radius: 999px; background: var(--text-muted); }

.options { display: flex; flex-direction: column; gap: 8px; }
.option { text-align: left; width: 100%; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--background); display: flex; gap: 12px; }
.option[aria-checked="true"] { border: 2px solid var(--primary); padding: 11px 13px; }
.radio { width: 20px; height: 20px; flex: none; margin-top: 2px; border-radius: 999px; border: 2px solid var(--text-muted); display: grid; place-items: center; }
.option[aria-checked="true"] .radio { border-color: var(--primary); }
.option[aria-checked="true"] .radio::after { content: ""; width: 10px; height: 10px; border-radius: 999px; background: var(--primary); }
.option small { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 2px; }
mark { background: transparent; color: var(--primary); font-weight: 600; text-decoration: underline 2px; text-underline-offset: 4px; }
.footnote { font-size: 13px; color: var(--text-muted); }

/* ④ 털어놓기 */
.vent-field { width: 100%; min-height: 132px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); resize: none; }
.count { font-size: 13px; color: var(--text-muted); text-align: right; margin-top: 4px; }
.notes { list-style: none; font-size: 13px; color: var(--text-muted); display: flex; flex-direction: column; gap: 6px; }

/* ⑤ 거울 */
.mirror-wrap { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.progress { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); }
.progress i { width: 24px; height: 4px; border-radius: 999px; background: var(--mirror); }
.progress span { margin-left: 6px; }
.card { padding: 20px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 16px; }
.kind { align-self: flex-start; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--mirror); color: var(--on-mirror); }
.said { align-self: flex-start; }
.said .bubble { display: inline-block; background: var(--primary); color: var(--on-primary); }
.q { font-weight: 600; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.cell { min-height: 48px; border-radius: 12px; border: 1px solid var(--border); background: var(--background); font-weight: 600; }
.cell[aria-checked="true"] { background: var(--mirror); border-color: var(--mirror); color: var(--on-mirror); }
.scale-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); margin-top: 6px; }
.result { border-top: 1px solid var(--border); padding-top: 16px; }
.result strong { display: block; font-size: 20px; font-weight: 600; color: var(--mirror); margin-bottom: 4px; }

/* ⑥ 리포트 */
.report { padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { padding: 14px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
.stat b { display: block; font-size: 20px; font-weight: 600; }
.stat span { font-size: 13px; color: var(--text-muted); }
.chart { padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
.chart h3 { font-size: 16px; font-weight: 600; }
.chart p { font-size: 13px; color: var(--text-muted); }
.bars { list-style: none; height: 168px; margin-top: 16px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; align-items: end; border-bottom: 1px solid var(--border); }
.bars li { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.bars .v { font-size: 13px; color: var(--text-muted); }
.bars .b { width: 28px; border-radius: 4px 4px 0 0; background: var(--text-muted); }
.bars li.now .b { background: var(--primary); }
.bars li.now .v { color: var(--text); font-weight: 600; }
.weeks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; margin-top: 6px; font-size: 13px; color: var(--text-muted); text-align: center; }
.calm { font-size: 13px; color: var(--text-muted); }

@media (prefers-reduced-motion: reduce) {
  .hint { animation-name: fade-in; }
  .typing span { animation: none; opacity: .6; }
  button { transition: none; }
}
</style>
</head>

</main>

<script>
(() => {
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const paintThemeBtn = () => {
    const dark = isDark();
    themeBtn.setAttribute('aria-pressed', String(dark));
    themeBtn.querySelector('use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
    themeBtn.querySelector('span').textContent = dark ? '라이트 모드' : '다크 모드';
  };
  themeBtn.addEventListener('click', () => { root.dataset.theme = isDark() ? 'light' : 'dark'; paintThemeBtn(); });
  paintThemeBtn();

  // 힌트 닫기 / 다시 띄우기 (나타나는 움직임 확인용)
  const hint = document.getElementById('hint');
  document.getElementById('hint-close').addEventListener('click', () => { hint.hidden = true; });
  document.getElementById('replay').addEventListener('click', () => {
    hint.hidden = true; void hint.offsetWidth; hint.hidden = false;
  });

  // 의도 칩: 하나만, 다시 누르면 해제(고르지 않아도 됨)
  document.querySelectorAll('[data-single]').forEach(group => group.addEventListener('click', e => {
    const chip = e.target.closest('.chip'); if (!chip) return;
    const on = chip.getAttribute('aria-pressed') !== 'true';
    group.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === chip && on)));
  }));

  // 라디오 묶음(후보 A/B, 1~5칸)
  document.querySelectorAll('[role="radiogroup"]').forEach(group => group.addEventListener('click', e => {
    const item = e.target.closest('[role="radio"]'); if (!item) return;
    group.querySelectorAll('[role="radio"]').forEach(r => r.setAttribute('aria-checked', String(r === item)));
    if (group.classList.contains('scale')) showGap(Number(item.textContent));
  }));

  // 예측 맞히기: 비슷한 대화에서 읽힌 칸(데모 값 3)과의 차이만 보여 준다
  const PANEL = 3, WORDS = ['', '한', '두', '세', '네'];
  const showGap = pick => {
    const gap = Math.abs(pick - PANEL);
    document.getElementById('gap').textContent = gap ? `예측과 ${WORDS[gap]} 칸 차이` : '예측과 같아요';
    document.getElementById('gap-note').textContent = pick < PANEL
      ? "선배에게는 생각보다 조금 더 재촉처럼 읽힐 수도 있어요. '자료 언제쯤 받을 수 있을까요?'처럼 물으면 덜 급해 보일 수 있어요."
      : pick > PANEL
        ? '선배에게는 생각보다 덜 부정적으로 읽힐 수도 있어요. 짧은 질문이라 무난하게 넘어가기도 해요.'
        : '비슷하게 읽힐 수 있어요. 이 문장은 조금 급해 보일 수도 있어요.';
  };

  const vent = document.getElementById('vent');
  const count = document.getElementById('vent-count');
  const paintCount = () => { count.textContent = vent.value.length; };
  vent.addEventListener('input', paintCount); paintCount();
})();
</script>
</body>
</html>
