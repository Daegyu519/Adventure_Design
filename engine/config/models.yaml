# 모델 배치 설정. 모델 이름은 코드에 없고 여기에만 있다.
# 키가 없는 공급자는 자동으로 건너뛴다. 실제 모델이 모두 막히면 mock으로 떨어지지 않고 기권(NoResult)한다. mock은 force_mock(테스트·평가)에서만 쓴다.

providers:
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    rpm: 40            # 모델마다 다름. build.nvidia.com 화면 오른쪽 위에서 확인
                       # 추정: 힌트 하나에 호출 약 2번(context+tone), 상세는 약 4~5번 → 합쳐서 분당 힌트 약 15~20개가 한도
  # 합성 문장 평가 전용. 실제 대화가 지나가는 experts·fallback에는 넣지 않는다(무료 등급 입력은 구글 학습에 쓰일 수 있음).
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    rpm: 15
  # github는 쓰지 않는다(무료 등급 데이터 약관 미확인, P-06). 사슬 어디에도 넣지 않았다.
  github:
    base_url: https://models.github.ai/inference
    api_key_env: GITHUB_TOKEN
    rpm: 10            # 하루 50~150회, 요청당 입력 8K 토큰
  local:
    base_url: http://localhost:11434/v1  # scripts/gpu up(학교 GPU llama-server 터널) 또는 Ollama. vLLM이면 http://localhost:8000/v1
    api_key_env: LOCAL_API_KEY           # 비어 있어도 됨
    rpm: 600
    allow_no_key: true
  local_fast:
    base_url: http://localhost:11435/v1  # 실시간용 Gemma3-4B llama-server(학교 GPU, up.sh llm·scripts/gpu up). P-12
    api_key_env: LOCAL_API_KEY
    rpm: 600
    allow_no_key: true
  mock:
    rpm: 100000

# 모델 선택(P-06, 2026-10-31, 이 NVIDIA 계정 실측): 추론 모델(nemotron-3-ultra·nano-omni)은 생각 토큰 때문에 3~15초라 실시간에 못 쓴다.
# laguna-xs-2.1(한가할 때 ~1초, 부하 때 4~12초)을 빠른 쪽, nemotron-3.5-bolt-e4b(1~3초, 부하 때 4~12초, 고쳐 쓰기가 지시를 더 잘 따름)를 깊은 쪽·폴백으로 쓴다.
# 실시간 힌트는 지금 사실상 꺼짐(전문가가 1.2초 안에 못 옴 → 기권). 상세·거울(8초)만 쓸 만하다.
# 응답 없음(2026-10-31): deepseek-v4.1-flash(500·시간 초과), kimi-k3(카탈로그에 없음)·kimi-k2.6(404), mistral-large-4(시간 초과). AGENTS §9에서 다시 확인.
# 전문가 id의 tone_ds·tone_kimi·ctx_fast·ctx_deep은 옛 모델 이름의 흔적일 뿐이다(테스트가 id를 쓰므로 그대로 둔다).
# 전문가. 추가·제거는 여기서만 한다. mock은 force_mock(테스트·평가)가 쓸 mock_rules 이름(없으면 prompt 이름).
# optional은 첫 모델 공급자를 쓸 수 없으면 빠진다. HyperCLOVA X는 생성(rewrite)에 쓰지 않는다(라이선스).
experts:
  # 실시간 말투: 짧은 답(prompts/tone_fast.md)으로 1.2초 안에 드는 로컬 Gemma3-4B. 대조 세트 정밀도 1.0·재현율 0.38, p95 0.87~1.0초(P-12)
  - {id: tone_fast, role: tone,     model: local_fast:gemma-3-4b-it, prompt: tone_fast, paths: [realtime], weight: 1.0, mock: tone}
  - {id: ctx_fast,  role: context,  model: nvidia:poolside/laguna-xs-2.1, prompt: context,  paths: []}   # 실시간 1.2초에 못 와서 뺌(P-12)
  - {id: ctx_deep,  role: context,  model: nvidia:nvidia/nemotron-3.5-bolt-e4b,              prompt: context,  paths: [detail, mirror]}
  - {id: tone_ds,   role: tone,     model: nvidia:poolside/laguna-xs-2.1, prompt: tone,     paths: [detail, mirror], weight: 1.0}
  - {id: tone_kimi, role: tone,     model: nvidia:nvidia/nemotron-3.5-bolt-e4b,              prompt: tone,     paths: [detail, mirror], weight: 1.0, mock: tone_alt}
  - {id: tone_hcx,  role: tone,     model: local:naver-hyperclovax/HyperCLOVAX-SEED-Text-Instruct-1.5B, prompt: tone, paths: [detail, mirror], weight: 1.0, optional: true}
  - {id: judge,     role: judge,    model: nvidia:nvidia/nemotron-3.5-bolt-e4b,              prompt: judge,    paths: [detail, mirror]}
  - {id: rewrite,   role: rewrite,  model: nvidia:poolside/laguna-xs-2.1, prompt: rewrite,  paths: [detail, mirror]}
  - {id: feedback,  role: feedback, model: nvidia:nvidia/nemotron-3.5-bolt-e4b,              prompt: feedback, paths: [async]}
fallback:   # 실제 문장이 지나가므로 gemini 금지
  local_fast:gemma-3-4b-it: [nvidia:poolside/laguna-xs-2.1, mock:auto]   # 학교 GPU가 없으면 NVIDIA(대개 1.2초를 넘겨 기권)
  nvidia:poolside/laguna-xs-2.1: [nvidia:nvidia/nemotron-3.5-bolt-e4b, mock:auto]
  nvidia:nvidia/nemotron-3.5-bolt-e4b: [nvidia:poolside/laguna-xs-2.1, mock:auto]
paths:
  realtime: {deadline_ms: 1500, expert_deadline_ms: 1200, gate_threshold: 0.1}   # 0.3이면 pilot 요청이 전부 게이트에서 멈췄다(P-12)
  detail:   {deadline_ms: 8000}
  mirror:   {deadline_ms: 8000}
  async:    {deadline_ms: 60000}
aggregate:
  weights: {bias: -2.2, prior: 1.6, neg: 2.4, violation: 1.4, pattern: 0.9}
  alert_threshold: 0.6
  max_disagreement: 0.35
  min_confidence: 0.4
  global_min_obs: 5     # 신호별 서로 다른 신고자 수

limits:            # 사용자 1명이 1분에 보낼 수 있는 요청 수(/v1/*). 넘으면 429 rate_limited
  hint: 90         # 입력 중 0.5초 디바운스 기준 여유
  default: 20      # detail, feedback, mirror, stats
