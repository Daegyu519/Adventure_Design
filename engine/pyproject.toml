[project]
name = "tone-engine"
version = "0.1.0"
description = "tone-chat AI engine (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "pywebpush>=2.0",
    "requests>=2.31",
    "pyjwt[crypto]>=2.10.1",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.0",
]

[tool.uv]
package = false  # 앱이지 배포 패키지가 아니다

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["legacy_rt: 실시간에 context 전문가가 있는 테스트 전용 설정(P-12 이전 구조)으로 시험한다"]
