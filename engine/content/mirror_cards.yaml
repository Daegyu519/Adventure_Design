# 거울 세션 상황 카드(ARCHITECTURE 3-5, T-35). 모든 문구는 지어낸 합성 문장이다(실제 대화 아님).
# 문구는 엔진이 읽을 때 guard 검사를 거친다(tests/test_mirror.py가 파일을 검사한다). 다른 메신저 이름은 쓰지 않는다.
# personas: 지어낸 인물. 보낸 문장 카드의 인물은 방 관계가 같은 첫 인물이다.
# inner_voice: 가장 많이 읽힌 뜻 → 받았을 때 속마음 한 줄. 문장에 대한 느낌만 쓴다(사람 평가 금지).
# cards: topic별 5장. sample_reply는 보낸 문장이 모자랄 때 되돌려 받기·예측 문장으로 쓴다(서로 겹치지 않게).

personas:
  - {name: 민지, relation: 팀원}
  - {name: 준호, relation: 팀원}
  - {name: 서연, relation: 선후배}
  - {name: 태오, relation: 선후배}

inner_voice:
  차갑게: "받는 쪽에선 '말이 좀 딱딱하네' 싶을 수도 있어요"
  성의없게: "받는 쪽에선 '짧게 넘기는 말이네' 싶을 수도 있어요"
  화나게: "받는 쪽에선 '말끝이 날카롭네' 싶을 수도 있어요"
  무난하게: "받는 쪽에선 '알겠다' 하고 편하게 넘길 수도 있어요"
  따뜻하게: "받는 쪽에선 '신경 써 준 말이네' 싶어 마음이 놓일 수도 있어요"

